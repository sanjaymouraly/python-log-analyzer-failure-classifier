[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-log-anomaly-analyzer"
version = "1.0.0"
description = "Local-first Python application log analyzer, failure classifier, fingerprint grouper, and statistical spike detector."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
keywords = [
  "logging",
  "log-analyzer",
  "anomaly-detection",
  "failure-classification",
  "devops",
  "observability",
  "sre",
  "pandas",
  "matplotlib"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Typing :: Typed"
]
dependencies = [
  "pandas>=2.1.0",
  "matplotlib>=3.8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0"
]

[project.scripts]
log-analyzer = "log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/log_analyzer"]
branch = true
omit = [
  "src/log_analyzer/__main__.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "SIM",
  "C4"
]
ignore = [
  "E501"
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["log_analyzer"]
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/sanjaymouraly/python-log-analyzer-failure-classifier"
Repository = "https://github.com/sanjaymouraly/python-log-analyzer-failure-classifier"
Issues = "https://github.com/sanjaymouraly/python-log-analyzer-failure-classifier/issues"

